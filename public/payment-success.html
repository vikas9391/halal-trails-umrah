<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment received | Halal Trails</title><link rel="stylesheet" href="/styles.css"><style>.success{min-height:75vh;display:grid;place-items:center;background:var(--cream);padding:50px 20px}.panel{width:min(680px,100%);background:white;border:1px solid var(--line);border-radius:26px;padding:42px;box-shadow:var(--shadow)}.check{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--forest);font-size:30px}.panel h1{font-family:Georgia,serif;font-size:45px;font-weight:500;margin:18px 0 10px}.summary{margin:25px 0;padding:20px;background:var(--soft);border-radius:15px}.summary div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #dce5d7}.summary div:last-child{border:0}.muted{color:var(--muted)}</style></head><body><header class="nav"><div class="shell navin"><a class="brand" href="/"><span class="mark">HT</span><span>HALAL TRAILS<small>TRAVEL WITH PURPOSE</small></span></a></div></header><main class="success"><div class="panel"><div class="check">✓</div><h1 id="title">Confirming your payment…</h1><p class="muted" id="message">Please keep this page open for a moment.</p><div id="summary" class="summary" hidden></div><a class="btn primary" href="/">Back to trip page</a></div></main><script>
(async()=>{const p=new URLSearchParams(location.search);const s=p.get('session_id');if(!s){document.getElementById('title').textContent='Payment page opened without a session';return;}try{const r=await fetch('/api/checkout-status?session_id='+encodeURIComponent(s));const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify');document.getElementById('title').textContent='JazakAllahu khairan, '+d.firstName+'.';document.getElementById('message').textContent='Your payment was received. A confirmation email will be sent to '+d.email+'.';const box=document.getElementById('summary');box.hidden=false;box.innerHTML='<div><span>Booking</span><strong>'+d.bookingId+'</strong></div><div><span>Room</span><strong>'+d.room+'</strong></div><div><span>Plan</span><strong>'+d.plan+'</strong></div><div><span>Package total</span><strong>$'+Number(d.total).toLocaleString()+'</strong></div><div><span>Paid today</span><strong>$'+Number(d.paidToday).toLocaleString()+'</strong></div>';}catch(e){document.getElementById('title').textContent='Payment received';document.getElementById('message').textContent='Stripe returned you to Halal Trails. If your email does not arrive shortly, contact billing@halal-trails.com with your payment receipt, or info@halal-trails.com for general support.';}})();
</script></body></html>
